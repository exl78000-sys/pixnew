name: 西甲戰情室 即時比分

on:
  workflow_dispatch:
  schedule:
    # 原本是 */5,而這支**沒有「沒比賽就結束」的守衛** —— 等於沒有比賽也每天
    # 打 288 次、576 個 SportMonks 請求,違背使用者「沒比賽就不用頻繁」那條。
    # 2026-08-29 補上 live-window 守衛之後改成 */15:沒比賽時幾秒就結束,
    # 有比賽時每次執行都會抓到(進場窗口是開賽前 75 分鐘到開賽後 140 分鐘)。
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: laliga-matchday
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: epl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 沒有比賽就不要打 API。這支原本沒有這道守衛,排程一開就是不分晝夜每次都抓。
      - name: 現在該不該進場?
        id: win
        run: node scripts/live-window.mjs --league=es1 --github

      - name: 沒比賽就結束
        if: steps.win.outputs.active != 'true'
        run: echo "· 不進場:${{ steps.win.outputs.reason }}"

      - name: 抓取西甲 SportMonks 即時比分
        if: steps.win.outputs.active == 'true'
        run: npm run laliga:live -- --max-requests=2
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          SPORTMONKS_KEY: ${{ secrets.SPORTMONKS_KEY }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
        continue-on-error: true

      # 快照內容沒有變化時不 build、不提交，避免空耗 Actions 與觸發部署。
      # 沒進場時連這一步都不用跑 —— 沒抓就不可能有變化。
      - name: 有變化才建置並回寫
        if: steps.win.outputs.active == 'true'
        run: |
          set -u
          cd "$GITHUB_WORKSPACE"
          # git diff 不會把未追蹤檔視為變化；首次成功抓到的快照必須照樣建置並回寫。
          if git diff --quiet -- epl/data/raw/sportmonks-la-liga/live.json \
            && git ls-files --error-unmatch epl/data/raw/sportmonks-la-liga/live.json >/dev/null 2>&1; then
            echo "即時快照沒有變化"
            exit 0
          fi
          cd epl
          npm run laliga:build
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f epl/data/raw/sportmonks-la-liga/live.json \
            epl/web/data/leagues/es1/live.json epl/web/data/leagues/es1/meta.json \
            epl/web/data/leagues/es1/reports.json
          if git diff --cached --quiet; then
            echo "建置後沒有可提交的即時資料"
            exit 0
          fi
          git commit -m "chore(laliga): 更新即時比分 [skip ci]"
          for try in 1 2 3; do
            git pull --rebase -q origin "$GITHUB_REF_NAME" 2>/dev/null || true
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "已回寫西甲即時比分"
              exit 0
            fi
            echo "推送衝突，重試 $try"
            sleep 3
          done
          exit 1
