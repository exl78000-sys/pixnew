# 名字不列聯賽:2026-09-16 從「西甲與英冠」擴到五個,而檔名(laliga-)改不了
# ——「這一批是誰」寫死在標題上,加一個聯賽就是假的(本站犯過的同一種)
name: 英超以外各聯賽 即時比分(比賽夜輪詢)

on:
  workflow_dispatch:
  schedule:
    # 原本是 */5,而這支**沒有「沒比賽就結束」的守衛** —— 等於沒有比賽也每天
    # 打 288 次、576 個 SportMonks 請求,違背使用者「沒比賽就不用頻繁」那條。
    # 2026-08-29 補上 live-window 守衛之後改成 */15。
    #
    # 同日再改:分鐘**錯開整點與一刻** —— GitHub 的 cron 在壅塞時段會整批丟棄
    # (實測 2026-08-29:14:26 之後到 16:45 一次都沒開火,LEV|BET 整場零覆蓋;
    # 前一晚 RAC|ELC 與 ALA|VIL 也是整晚零執行),而 :00/:15/:30/:45 是最擠的槽。
    # 單發式扛不住 cron 斷供,所以下面也改成了迴圈:只要有一發進場,整個
    # 比賽時段都在;cron 只是點火器,錯開分鐘提高點火成功率。
    - cron: '9,24,39,54 * * * *'

permissions:
  contents: write

concurrency:
  group: laliga-matchday
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 250    # 迴圈要涵蓋整個比賽時段(cron 是不可靠的點火器,進場一次就撐完全場)
    defaults:
      run:
        working-directory: epl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 沒有比賽就不要打 API。這支原本沒有這道守衛,排程一開就是不分晝夜每次都抓。
      # **聯賽清單只寫一次**(LGS):原本西甲英冠寫死在這個檔案的七個地方,
      # 加德義法時漏掉任何一處,那個聯賽的比賽夜就靜靜不會被輪詢,而畫面完全正常。
      - name: 現在該不該進場?
        id: win
        run: |
          echo "es1 en2 de1 it1 fr1" > /tmp/lgs
          for lg in $(cat /tmp/lgs); do
            node scripts/live-window.mjs --league=$lg > /tmp/w-$lg.json 2>/dev/null || echo '{}' > /tmp/w-$lg.json
          done
          node -e '
            const fs = require("fs");
            const lgs = fs.readFileSync("/tmp/lgs", "utf8").trim().split(/\s+/);
            const w = lgs.map(lg => { try { return [lg, JSON.parse(fs.readFileSync(`/tmp/w-${lg}.json`, "utf8"))]; } catch { return [lg, {}]; } });
            const active = w.some(([, x]) => x.active);
            // 都沒開賽時睡到**最早**那一場(取 min);有人在踢就不睡
            const sleeps = w.map(([, x]) => x.sleepSec ?? 0).filter(n => n > 0);
            const sleep = active || !sleeps.length ? 0 : Math.min(...sleeps);
            const reason = w.map(([lg, x]) => `${lg}:${x.reason ?? "?"}`).join(" | ");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `active=${active}\nsleep=${sleep}\nreason=${reason}\n`);
          '

      - name: 沒比賽就結束
        if: steps.win.outputs.active != 'true'
        run: echo "· 不進場:${{ steps.win.outputs.reason }}"

      # 迴圈:進場一次就撐完整個比賽時段(跟 epl-matchday 同一個道理)。
      # 之前是單發式,每次 cron 抓一發就走 —— 而 cron 在壅塞時段整批不開火,
      # 一斷就是整場比賽零覆蓋。改成迴圈後 cron 只要成功點火一次就夠。
      # FotMob 請求量:只在進場窗口內、每 3 分鐘 2 個請求(兩個聯賽各一),沒比賽時一個都不發。
      - name: 輪詢更新(每 3 分鐘)
        if: steps.win.outputs.active == 'true'
        # 迴圈只打 FotMob(scores:fetch);SportMonks 2026-09-03 退訂,env 已拿掉
        run: |
          set -u
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd epl

          # 還沒開賽就先睡到開賽前,不要空轉
          SLEEP='${{ steps.win.outputs.sleep }}'
          if [ "$SLEEP" -gt 0 ] 2>/dev/null; then
            echo "  距離進場還有 ${SLEEP}s,先等"
            sleep "$SLEEP"
          fi

          # ── 聯賽清單只寫這一次 ──
          # 這個檔案原本把「西甲 + 英冠」寫死在七個地方(進場判斷、輪詢、git diff、
          # 兩支 build、git add、checkout --theirs、收工判斷)。加德義法時漏掉任何一處,
          # 那個聯賽的比賽夜就**靜靜不會被輪詢**,而 log 與畫面都完全正常。
          LGS="es1 en2 de1 it1 fr1"
          raw_of() { case "$1" in
            es1) echo fotmob-la-liga ;; en2) echo fotmob-championship ;;
            de1) echo fotmob-bundesliga ;; it1) echo fotmob-serie-a ;; fr1) echo fotmob-ligue-1 ;;
          esac; }
          # build 的 npm script 名:西甲是歷史遺留的 laliga:build,其餘都是 {代碼}:build
          build_of() { case "$1" in es1) echo laliga:build ;; *) echo "$1:build" ;; esac; }
          SCORE_PATHS=""; LEAGUE_DIRS=""
          for lg in $LGS; do
            SCORE_PATHS="$SCORE_PATHS epl/data/raw/$(raw_of $lg)/scores.json"
            LEAGUE_DIRS="$LEAGUE_DIRS epl/web/data/leagues/$lg"
          done
          echo "  這一輪涵蓋的聯賽:$LGS"

          POLL=180
          END=$(( $(date +%s) + 13800 ))   # 3 小時 50 分,低於 timeout-minutes
          N=0; PUSHED=0
          while [ "$(date +%s)" -lt "$END" ]; do
            N=$((N+1))
            # FotMob 賽程端點:一個聯賽一個請求(SportMonks 停了之後的來源,2026-09-04)。
            # **只打現在真的有比賽的那幾個**:五個聯賽全打的話沒比賽的那些是白費請求,
            # 而使用者要的是「沒有比賽就不用頻繁」。判斷是本機的,不花請求。
            NOW_LGS=""
            for lg in $LGS; do
              if node scripts/live-window.mjs --league=$lg 2>/dev/null | grep -q '"active":true'; then
                NOW_LGS="$NOW_LGS $lg"
              fi
            done
            # 判斷不出來就全打 —— 漏掉一場比賽的代價高於多幾個請求(收工那條同一個道理)
            [ -z "$NOW_LGS" ] && NOW_LGS="$LGS"
            for lg in $NOW_LGS; do
              npm run scores:fetch -- --league=$lg >/dev/null 2>&1 || true
            done

            cd "$GITHUB_WORKSPACE"
            # git diff 不會把未追蹤檔視為變化;首次成功抓到的快照必須照樣建置並回寫
            if git diff --quiet -- $SCORE_PATHS \
              && git ls-files --error-unmatch epl/data/raw/fotmob-la-liga/scores.json >/dev/null 2>&1; then
              echo "  [$N] 無變化"
            else
              for lg in $LGS; do
                (cd epl && npm run "$(build_of $lg)" >/dev/null 2>&1) || true
              done
              # 這兩支只跑聯賽 build,不跑 `build` —— 而資產戳是 `build` 最後的 stamp-assets
              # 寫進**每個**聯賽 meta.json 的。少了這一步,倉庫裡 es1 與 en2 的 meta 從比賽夜
              # 到下一次部署之間都沒有戳,`npm test` 的「meta 記的戳跟實際檔案一致」在那段時間的
              # 任何一個 checkout 上都會紅。CI 剛好每次都在 build 之後才測,所以一直沒被看見。
              # stamp 只讀內容雜湊,HTML 與 JS 已經是戳過的就不會被動到(實測 0 檔案 0 頁)。
              (cd epl && npm run stamp >/dev/null 2>&1) || true
              # 逐個判斷存不存在再 add:一個 add 列多個路徑而其中一個不存在,
              # git 整條失敗、**一個檔都沒加**,而錯誤被 `|| true` 吞掉(踩過)
              for pth in $SCORE_PATHS epl/data/raw/sportmonks-la-liga/finals.json \
                epl/data/live-history-la-liga.json $LEAGUE_DIRS; do
                [ -e "$pth" ] && git add -f "$pth" 2>/dev/null || true
              done
              if git diff --cached --quiet; then
                echo "  [$N] 產物無變化"
              else
                git commit -q -m "chore(laliga): 即時比分 $(date -u '+%H:%M UTC') [skip ci]"
                # rebase 失敗要 abort:半途的 rebase 會讓之後每一輪的 git 全部失效
                # (epl-matchday 實際踩過 —— 迴圈看起來在跑,實際一筆都推不出去)
                for try in 1 2 3; do
                  if ! git pull --rebase -q origin "$GITHUB_REF_NAME" 2>/dev/null; then
                    git rebase --abort 2>/dev/null || true
                    git checkout --theirs -- $SCORE_PATHS epl/data/live-history-la-liga.json 2>/dev/null || true
                  fi
                  if git push -q origin "HEAD:${GITHUB_REF_NAME}" 2>/dev/null; then
                    PUSHED=$((PUSHED+1)); echo "  [$N] ✔ 已更新並推送"; break
                  fi
                  echo "  [$N] 推送衝突,重試 $try"; sleep 3
                done
                # 推不出去就放棄這一輪、回到遠端狀態 —— 丟一輪比卡死整個迴圈好
                if ! git diff --quiet origin/"$GITHUB_REF_NAME"..HEAD 2>/dev/null; then
                  git rebase --abort 2>/dev/null || true
                  git fetch -q origin "$GITHUB_REF_NAME" && git reset --hard -q "origin/$GITHUB_REF_NAME"
                  echo "  [$N] ⚠ 推送失敗,重置到遠端狀態繼續"
                fi
              fi
            fi
            cd epl

            # 還有比賽在踢嗎?沒有就收工 —— **但判斷不出來時要繼續跑**。
            # 原本寫 `!= "true"`,於是那條管線任何一點閃失(輸出空、JSON 壞、
            # fixtures.json 剛好被同一輪的 build 改寫到一半)都會被當成「比賽都結束了」。
            # 2026-08-31 實測:AVL vs ARS 19:00 開球,迴圈 19:00 整收工,
            # 整場沒有任何輪詢 —— 而 decideWindow 當下其實回的是 active:true。
            # 只有明確收到 false 才收工;unknown 多跑一輪的成本,遠低於漏掉一場比賽。
            # **要帶 --league**:原本沒帶,預設看的是英超的窗口(踩到);兩聯賽任一個還在踢就繼續
            # 任一個聯賽還在踢就繼續。**明確收到 false 才收工** —— 讀不出來當 unknown,
            # 多跑一輪的成本遠低於漏掉一場比賽(上面那段註解講的就是這件事)。
            ACTIVE=unknown
            ANY=false; ALLREAD=true
            for lg in $LGS; do
              OUT=$(node scripts/live-window.mjs --league=$lg 2>/dev/null || true)
              case "$OUT" in
                *'"active":true'*)  ANY=true ;;
                *'"active":false'*) : ;;
                *) ALLREAD=false ;;
              esac
            done
            if [ "$ANY" = "true" ]; then ACTIVE=true
            elif [ "$ALLREAD" = "true" ]; then ACTIVE=false
            fi
            if [ "$ACTIVE" = "false" ]; then
              echo "  比賽都結束了,收工(輪詢 $N 次、推送 $PUSHED 次)"
              break
            fi
            [ "$ACTIVE" = "true" ] || echo "  [$N] ⚠ 判斷不出還有沒有比賽($ACTIVE),繼續跑"
            sleep "$POLL"
          done
          echo "◀ 結束:輪詢 $N 次、推送 $PUSHED 次"

  # 失敗要**主動說** —— 這一支原本紅了完全沒有聲音,而它是排程跑的,
  # 沒有人守在旁邊看 log。邏輯在 `notify-ci.yml`(一份,不複製)。
  notify:
    needs: [poll]
    if: always()
    permissions:
      issues: write
      actions: read
    uses: ./.github/workflows/notify-ci.yml
    with:
      key: laliga-matchday
      results: ${{ toJSON(needs) }}
