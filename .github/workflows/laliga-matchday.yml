name: 西甲與英冠 即時比分

on:
  workflow_dispatch:
  schedule:
    # 原本是 */5,而這支**沒有「沒比賽就結束」的守衛** —— 等於沒有比賽也每天
    # 打 288 次、576 個 SportMonks 請求,違背使用者「沒比賽就不用頻繁」那條。
    # 2026-08-29 補上 live-window 守衛之後改成 */15。
    #
    # 同日再改:分鐘**錯開整點與一刻** —— GitHub 的 cron 在壅塞時段會整批丟棄
    # (實測 2026-08-29:14:26 之後到 16:45 一次都沒開火,LEV|BET 整場零覆蓋;
    # 前一晚 RAC|ELC 與 ALA|VIL 也是整晚零執行),而 :00/:15/:30/:45 是最擠的槽。
    # 單發式扛不住 cron 斷供,所以下面也改成了迴圈:只要有一發進場,整個
    # 比賽時段都在;cron 只是點火器,錯開分鐘提高點火成功率。
    - cron: '9,24,39,54 * * * *'

permissions:
  contents: write

concurrency:
  group: laliga-matchday
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 250    # 迴圈要涵蓋整個比賽時段(cron 是不可靠的點火器,進場一次就撐完全場)
    defaults:
      run:
        working-directory: epl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 沒有比賽就不要打 API。這支原本沒有這道守衛,排程一開就是不分晝夜每次都抓。
      # 西甲或英冠任一個有比賽就進場(2026-09-04 起英冠也走這條,比分來源是 FotMob 賽程端點)
      - name: 現在該不該進場?
        id: win
        run: |
          node scripts/live-window.mjs --league=es1 > /tmp/w-es1.json
          node scripts/live-window.mjs --league=en2 > /tmp/w-en2.json
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("/tmp/w-es1.json", "utf8")), b = JSON.parse(fs.readFileSync("/tmp/w-en2.json", "utf8"));
            const active = a.active || b.active;
            const sleep = active ? 0 : Math.max(0, Math.min(a.sleepSec ?? 0, b.sleepSec ?? 0));
            const reason = `es1:${a.reason} | en2:${b.reason}`;
            console.log(JSON.stringify({ active, sleep, reason }));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `active=${active}\nsleep=${sleep}\nreason=${reason}\n`);
          '

      - name: 沒比賽就結束
        if: steps.win.outputs.active != 'true'
        run: echo "· 不進場:${{ steps.win.outputs.reason }}"

      # 迴圈:進場一次就撐完整個比賽時段(跟 epl-matchday 同一個道理)。
      # 之前是單發式,每次 cron 抓一發就走 —— 而 cron 在壅塞時段整批不開火,
      # 一斷就是整場比賽零覆蓋。改成迴圈後 cron 只要成功點火一次就夠。
      # FotMob 請求量:只在進場窗口內、每 3 分鐘 2 個請求(兩個聯賽各一),沒比賽時一個都不發。
      - name: 輪詢更新(每 3 分鐘)
        if: steps.win.outputs.active == 'true'
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          SPORTMONKS_KEY: ${{ secrets.SPORTMONKS_KEY }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
        run: |
          set -u
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd epl

          # 還沒開賽就先睡到開賽前,不要空轉
          SLEEP='${{ steps.win.outputs.sleep }}'
          if [ "$SLEEP" -gt 0 ] 2>/dev/null; then
            echo "  距離進場還有 ${SLEEP}s,先等"
            sleep "$SLEEP"
          fi

          POLL=180
          END=$(( $(date +%s) + 13800 ))   # 3 小時 50 分,低於 timeout-minutes
          N=0; PUSHED=0
          while [ "$(date +%s)" -lt "$END" ]; do
            N=$((N+1))
            # FotMob 賽程端點:一個聯賽一個請求(SportMonks 停了之後的來源,2026-09-04)
            npm run scores:fetch -- --league=es1 >/dev/null 2>&1 || true
            npm run scores:fetch -- --league=en2 >/dev/null 2>&1 || true

            cd "$GITHUB_WORKSPACE"
            # git diff 不會把未追蹤檔視為變化;首次成功抓到的快照必須照樣建置並回寫
            if git diff --quiet -- epl/data/raw/fotmob-la-liga/scores.json epl/data/raw/fotmob-championship/scores.json \
              && git ls-files --error-unmatch epl/data/raw/fotmob-la-liga/scores.json >/dev/null 2>&1; then
              echo "  [$N] 無變化"
            else
              (cd epl && npm run laliga:build >/dev/null 2>&1) || true
              (cd epl && npm run en2:build >/dev/null 2>&1) || true
              git add -f epl/data/raw/fotmob-la-liga/scores.json epl/data/raw/fotmob-championship/scores.json \
                epl/data/raw/sportmonks-la-liga/finals.json \
                epl/data/live-history-la-liga.json \
                epl/web/data/leagues/es1 epl/web/data/leagues/en2 2>/dev/null || true
              if git diff --cached --quiet; then
                echo "  [$N] 產物無變化"
              else
                git commit -q -m "chore(laliga): 即時比分 $(date -u '+%H:%M UTC') [skip ci]"
                # rebase 失敗要 abort:半途的 rebase 會讓之後每一輪的 git 全部失效
                # (epl-matchday 實際踩過 —— 迴圈看起來在跑,實際一筆都推不出去)
                for try in 1 2 3; do
                  if ! git pull --rebase -q origin "$GITHUB_REF_NAME" 2>/dev/null; then
                    git rebase --abort 2>/dev/null || true
                    git checkout --theirs -- epl/data/raw/fotmob-la-liga/scores.json epl/data/raw/fotmob-championship/scores.json epl/data/live-history-la-liga.json 2>/dev/null || true
                  fi
                  if git push -q origin "HEAD:${GITHUB_REF_NAME}" 2>/dev/null; then
                    PUSHED=$((PUSHED+1)); echo "  [$N] ✔ 已更新並推送"; break
                  fi
                  echo "  [$N] 推送衝突,重試 $try"; sleep 3
                done
                # 推不出去就放棄這一輪、回到遠端狀態 —— 丟一輪比卡死整個迴圈好
                if ! git diff --quiet origin/"$GITHUB_REF_NAME"..HEAD 2>/dev/null; then
                  git rebase --abort 2>/dev/null || true
                  git fetch -q origin "$GITHUB_REF_NAME" && git reset --hard -q "origin/$GITHUB_REF_NAME"
                  echo "  [$N] ⚠ 推送失敗,重置到遠端狀態繼續"
                fi
              fi
            fi
            cd epl

            # 還有比賽在踢嗎?沒有就收工 —— **但判斷不出來時要繼續跑**。
            # 原本寫 `!= "true"`,於是那條管線任何一點閃失(輸出空、JSON 壞、
            # fixtures.json 剛好被同一輪的 build 改寫到一半)都會被當成「比賽都結束了」。
            # 2026-08-31 實測:AVL vs ARS 19:00 開球,迴圈 19:00 整收工,
            # 整場沒有任何輪詢 —— 而 decideWindow 當下其實回的是 active:true。
            # 只有明確收到 false 才收工;unknown 多跑一輪的成本,遠低於漏掉一場比賽。
            # **要帶 --league**:原本沒帶,預設看的是英超的窗口(踩到);兩聯賽任一個還在踢就繼續
            ACTIVE=$(node scripts/live-window.mjs --league=es1 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const b=JSON.parse(require("child_process").execSync("node scripts/live-window.mjs --league=en2",{stdio:["ignore","pipe","ignore"]}).toString());console.log((a.active||b.active)?"true":"false")}catch{console.log("unknown")}})' 2>/dev/null || echo unknown)
            if [ "$ACTIVE" = "false" ]; then
              echo "  比賽都結束了,收工(輪詢 $N 次、推送 $PUSHED 次)"
              break
            fi
            [ "$ACTIVE" = "true" ] || echo "  [$N] ⚠ 判斷不出還有沒有比賽($ACTIVE),繼續跑"
            sleep "$POLL"
          done
          echo "◀ 結束:輪詢 $N 次、推送 $PUSHED 次"
