# 比賽日高頻更新 —— 有比賽在踢的時候,每 2 分鐘更新一次比分與陣容。
#
# 為什麼要獨立一個工作流程:
# GitHub 的 schedule 是 best-effort,實測設定 15 分鐘、實際間隔是 28~78 分鐘
# (平均 46 分鐘)。比賽中靠 cron 更新根本來不及。
#
# 但有一件事 cron 管不到:**job 內部的迴圈**。單一 job 最長可以跑 6 小時,
# 迴圈裡的 sleep 是準的。所以這裡換一個機制:
#   cron 只負責「開場」(延遲多久都沒關係,反正會提早 75 分鐘進場等),
#   真正的高頻更新放在 job 內的 while 迴圈裡。
#
# 沒有比賽時這個工作流程幾秒鐘就結束,不 build、不部署、不提交 ——
# 符合「沒比賽就不用頻繁」。私人 repo 也避免不必要地消耗 Actions 分鐘數。

name: 英超戰情室 比賽日高頻更新

on:
  workflow_dispatch:
  schedule:
    # 只是「開場」用。就算延遲 46 分鐘也接得上 —— 開賽前 75 分鐘就會進場,
    # 而且進行中的比賽任何一次執行都會抓到(MAX_WAIT_MIN 是 180)。
    # 真正的高頻更新在 job 內部的迴圈裡(每 2 分鐘),不受排程延遲影響。
    #
    # 沒有比賽時 live-window 會在幾秒內回 active=false,整個 job 就結束 ——
    # 不 build、不部署、不提交,符合使用者「沒比賽就不用頻繁」那條。
    # schedule 只會由**預設分支**觸發。
    # 分鐘錯開整點與一刻:GitHub 的 cron 在壅塞時段會整批丟棄
    # (實測 2026-08-29 下午 14:37 之後兩個多小時一次都沒開火),
    # 而 :00/:15/:30/:45 是最擠的槽。迴圈讓進場後不怕斷供,
    # 但**進場本身**還是靠 cron 點火 —— 錯開分鐘提高點火成功率。
    - cron: '4,19,34,49 * * * *'

permissions:
  contents: write

# 跟建置/部署分開,才不會互相卡住;同時只跑一個,避免兩個迴圈重複提交
concurrency:
  group: epl-matchday
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # 5.5 小時(GitHub 上限 6),足夠涵蓋一整個比賽時段
    defaults:
      run:
        working-directory: epl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 現在該不該進場?
        id: win
        run: node scripts/live-window.mjs --github

      - name: 沒比賽就結束
        if: steps.win.outputs.active != 'true'
        run: echo "· 不進場:${{ steps.win.outputs.reason }}"

      - name: 輪詢更新(每 2 分鐘)
        if: steps.win.outputs.active == 'true'
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          # 沿用 repo 已存在的 Secret；fetch-live 只在完賽且尚未快取時才會呼叫。
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -u
          echo "▶ 進場:${{ steps.win.outputs.reason }}"

          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd epl

          # 還沒開賽就先睡到開賽前,不要空轉燒時間
          SLEEP='${{ steps.win.outputs.sleep }}'
          if [ "$SLEEP" -gt 0 ] 2>/dev/null; then
            echo "  距離進場還有 ${SLEEP}s,先等"
            sleep "$SLEEP"
          fi

          POLL=120                      # 每 2 分鐘一次
          END=$(( $(date +%s) + 18000 )) # 這次執行最多撐 5 小時
          N=0; PUSHED=0

          while [ "$(date +%s)" -lt "$END" ]; do
            N=$((N+1))
            npm run live      >/dev/null 2>&1 || true
            npm run official  >/dev/null 2>&1 || true
            # 英格蘭盃賽(2026-09-08):--live 自己守門 —— 本季沒有「本站球隊」的場次在比賽窗內
            # 就一個請求都不發。有的話 TTL 3 分鐘,所以這個 2 分鐘的迴圈實際約每 3 分鐘一個請求。
            # 進場判斷(live-window)也已經把盃賽場次算進去,不然聯賽盃之夜根本不會進場。
            npm run cups:live >/dev/null 2>&1 || true
            # 歐冠(2026-09-09):同樣自己守門。9/8 那六場 21:00 踢完,而歐冠只在 12 小時一次的
            # 部署裡抓 —— raw 最後是 16:11 抓的(六場都還 SCHEDULED),下一次 04:09,
            # 於是盃賽頁的**預設分頁**整整七小時印「已開賽・等待資料」。那晚迴圈其實有進場,
            # 只是進場的理由是聯賽盃、進去之後沒有人去抓歐冠。
            npm run ucl:live  >/dev/null 2>&1 || true
            # 歐冠賽後報告(2026-09-12):踢完的場次立刻補 FotMob 逐場詳情,不等 12 小時一次的部署。
            # 自己守門:ucl.json 沒有新完賽就一個請求都不發;退回過的 30 分鐘內不重試。
            # 吃的是上一輪 build 出來的 ucl.json,所以報告比終場晚一輪(約 2 分鐘)。
            npm run game:fetch -- --league=ucl --limit=20 >/dev/null 2>&1 || true

            # 只有資料真的變了才 build + 提交 —— 沒變就不要製造空提交
            if git -C "$GITHUB_WORKSPACE" diff --quiet -- epl/data/raw/live.json epl/data/raw/pulselive/ epl/data/raw/api-football/ epl/data/live-history.json epl/data/raw/fotmob-cups/ epl/data/raw/football-data/ epl/data/raw/fotmob-ucl/; then
              echo "  [$N] 無變化"
            else
              npm run build >/dev/null 2>&1 || true
              cd "$GITHUB_WORKSPACE"
              git add -f epl/data/raw/live.json epl/data/raw/pulselive/ epl/data/raw/api-football/ epl/data/live-history.json epl/data/raw/fotmob-cups/ epl/data/raw/football-data/ epl/data/raw/fotmob-ucl/ epl/web/data/ 2>/dev/null || true
              if git diff --cached --quiet; then
                echo "  [$N] 產物無變化"
              else
                git commit -q -m "chore(epl): 比賽中更新 $(date -u '+%H:%M UTC') [skip ci]"
                # 建置/部署工作流程也會推同一個分支,推之前先接上
                # rebase 失敗要 abort —— 半途的 rebase 會讓之後每一輪的 git 全部失效,
                # 迴圈看起來還在跑、實際一筆都推不出去(2026-08-29 實際發生,
                # 開發分支高頻推送時撞上,整場上半場沒有即時更新)
                for try in 1 2 3; do
                  if ! git pull --rebase -q origin "$GITHUB_REF_NAME" 2>/dev/null; then
                    git rebase --abort 2>/dev/null || true
                    git checkout --theirs -- epl/data/raw/live.json epl/data/live-history.json 2>/dev/null || true
                  fi
                  if git push -q origin "HEAD:${GITHUB_REF_NAME}" 2>/dev/null; then
                    PUSHED=$((PUSHED+1)); echo "  [$N] ✔ 已更新並推送"; break
                  fi
                  echo "  [$N] 推送衝突,重試 $try"; sleep 3
                done
                # 三次都推不出去:放棄這一輪的提交、回到遠端狀態 —— 丟一輪資料
                # 比整個迴圈卡死好;下一輪重抓就補回來了
                if ! git diff --quiet origin/"$GITHUB_REF_NAME"..HEAD 2>/dev/null; then
                  git rebase --abort 2>/dev/null || true
                  git fetch -q origin "$GITHUB_REF_NAME" && git reset --hard -q "origin/$GITHUB_REF_NAME"
                  echo "  [$N] ⚠ 推送失敗,重置到遠端狀態繼續"
                fi
              fi
              cd epl
            fi

            # 還有比賽在踢嗎?沒有就收工 —— **但判斷不出來時要繼續跑**。
            # 原本寫 `!= "true"`,於是那條管線任何一點閃失(輸出空、JSON 壞、
            # fixtures.json 剛好被同一輪的 build 改寫到一半)都會被當成「比賽都結束了」。
            # 2026-08-31 實測:AVL vs ARS 19:00 開球,迴圈 19:00 整收工,
            # 整場沒有任何輪詢 —— 而 decideWindow 當下其實回的是 active:true。
            # 只有明確收到 false 才收工;unknown 多跑一輪的成本,遠低於漏掉一場比賽。
            ACTIVE=$(node scripts/live-window.mjs 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).active)}catch{console.log("unknown")}})' 2>/dev/null || echo unknown)
            if [ "$ACTIVE" = "false" ]; then
              echo "  比賽都結束了,收工(共輪詢 $N 次、推送 $PUSHED 次)"
              break
            fi
            [ "$ACTIVE" = "true" ] || echo "  [$N] ⚠ 判斷不出還有沒有比賽($ACTIVE),繼續跑"
            sleep "$POLL"
          done
          echo "◀ 結束:輪詢 $N 次、推送 $PUSHED 次"

  # 失敗要**主動說** —— 這一支原本紅了完全沒有聲音,而它是排程跑的,
  # 沒有人守在旁邊看 log。邏輯在 `notify-ci.yml`(一份,不複製)。
  notify:
    needs: [poll]
    if: always()
    permissions:
      issues: write
      actions: read
    uses: ./.github/workflows/notify-ci.yml
    with:
      key: epl-matchday
      results: ${{ toJSON(needs) }}
