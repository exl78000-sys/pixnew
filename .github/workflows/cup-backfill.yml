name: 盃賽賽後資料回填(手動)

# 英格蘭盃賽(足總盃、聯賽盃)的逐場詳情。2026-09-13 探測確認拿得到
# (stats / shotmap / lineup / events / playerStats 五塊都有,射門圖完整,PK 的互射靠 period 排得掉),
# 所以接線。**往季與已完賽的本季場次要手動回填** —— 足總盃 2025-26 有 123 場、
# 聯賽盃 2025-26 有 91 場、2026-27 已完賽 64 場,一場一個請求,是使用者的決定。
#
# 抓完的本季新場次由部署時的 epl-live 自己補(增量),這一支只負責「一次補一大批」。
# 沙箱連不到 FotMob,只能在 runner 上跑;抓取器自己守門:
#   matchId 來自倉庫裡的盃賽賽程快取(不是猜的)、比分要對回那份快取、退回過的 30 分鐘內不重試。
# 沒有掛 notify:手動的一次性工作,失敗就看 log(跟 ucl-backfill / probe-apis 同一個理由)。
on:
  workflow_dispatch:
    inputs:
      cup:
        description: '哪一個盃賽:facup(足總盃)或 eflcup(聯賽盃)'
        required: true
        default: 'eflcup'
      season:
        description: '賽季標籤,例如 2026-27;要在該盃賽的賽程快取裡'
        required: true
        default: '2026-27'
      limit:
        description: '本次請求上限;一場一個請求,整季 123 場一次 140 就補完'
        required: false
        default: '140'

concurrency:
  group: cup-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 抓盃賽逐場資料(FotMob)
        working-directory: epl
        # --retry:不理抓取器 30 分鐘的退避 —— 人按下去就是要現在試(退回的原因在 log 與索引的 attempts 裡)
        run: npm run game:fetch -- --league=${{ inputs.cup }} --season=${{ inputs.season }} --limit=${{ inputs.limit }} --retry

      - name: 回寫 raw
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f epl/data/raw/fotmob-facup/ epl/data/raw/fotmob-eflcup/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "raw 沒有變化,不提交"
            exit 0
          fi
          git commit -q -m "chore(epl): 盃賽 ${{ inputs.cup }} ${{ inputs.season }} 賽後資料回填 [skip ci]"
          # 同一條分支還有部署與比賽日迴圈在推;rebase 失敗就 abort 重來,最多三次
          for try in 1 2 3; do
            if git pull -q --rebase origin "$GITHUB_REF_NAME"; then
              if git push -q origin "HEAD:$GITHUB_REF_NAME"; then echo "已回寫(第 $try 次)"; exit 0; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep 5
          done
          echo "✗ 回寫連撞三次,這次的 raw 沒有進倉庫 —— 重跑一次就好(抓過的已經在 runner 上,但沒回寫就會重抓)"
          exit 1
