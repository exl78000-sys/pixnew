# 英超戰情室 —— 定時抓即時資料、回寫 repo、並(若已啟用)部署到 GitHub Pages
#
# 為什麼需要這個:即時比分要連官方 FPL API,而開發環境不一定連得到。
# GitHub 的 runner 沒有這個限制,所以讓它去抓,再把資料提交回來,
# 這樣不論在哪裡 build 都能拿到最新比分。
#
# GitHub Pages(選用):預設的 GITHUB_TOKEN 沒有「建立 Pages 站台」的權限,
# 所以第一次必須手動到 Settings → Pages → Source 選 "GitHub Actions"。
# 開啟之後這個工作流程會自動部署,不必再做任何事;還沒開啟就只會略過部署,不會讓整個流程失敗。

name: 英超戰情室 資料更新與部署

on:
  workflow_dispatch:
  schedule:
    # 每 12 小時一次 —— 這是「沒有比賽時」的日常更新(賽程、球員、賠率、教練),
    # 以及**唯一會部署 Pages 的地方**。
    #
    # 比賽中的比分不靠這裡:GitHub 的 schedule 是 best-effort,實測設定 15 分鐘、
    # 實際間隔 28~78 分鐘(平均 46)。比賽中的更新交給 epl-matchday.yml ——
    # 它在 job 內部每 2 分鐘抓一次並把 web/data/ 推回 repo,
    # 而**實時戰況頁每 20 秒自己去 raw.githubusercontent 讀那一份**
    # (meta.liveFeed),所以比賽中不需要重新部署也看得到最新比分與陣型。
    #
    # **刻意不恢復 push 觸發。** 原本 push 到 claude/** 就會跑一次完整建置與部署,
    # 那是「本機優先模式」關掉排程的主因(高頻更新與部署互相排隊)。
    # 要發布就手動 workflow_dispatch。
    - cron: '0 */12 * * *'

permissions:
  contents: write      # 把抓到的即時資料提交回 repo
  pages: write
  id-token: write

concurrency:
  group: epl-live
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.enabled }}
    defaults:
      run:
        working-directory: epl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 專案零依賴,不需要 npm install

      - name: 抓賽程與賽果(openfootball / FPL 鏡像)
        run: npm run fetch -- --force
        continue-on-error: true

      # 西甲只抓兩季公開賽程；獨立目錄，不會覆蓋英超同名賽季檔。
      - name: 抓西甲兩季賽程與賽果(openfootball)
        run: npm run laliga:fetch
        continue-on-error: true

      # 英冠:openfootball 的 en.2 與 football-data.co.uk 的 E1,四季共八個靜態檔。
      # 兩份是**獨立來源**,建站時逐場核對 —— 英冠沒有 FPL 也沒有 Understat,
      # 能互相驗的就只有這兩份(鐵則五)。
      - name: 抓英冠四季賽程、賽果與逐場統計
        run: npm run en2:fetch
        continue-on-error: true

      # 西甲球員整季數據(Understat)。一季一個請求,兩季共兩個 ——
      # API-Football 的 Free 方案不含這兩季,這是實測後改走的路。
      # 上季已完結,有檔就跳過;只有本季會每次重抓。
      - name: 抓西甲球員整季數據(Understat)
        run: npm run laliga:players
        continue-on-error: true

      # 歷史賽季的 Understat 進球情境。這是為了測「上一季的定位球/運動戰強弱
      # 對下一季有沒有預測力」—— 情境是整季彙總,拿本季彙總預測本季比賽是偷看未來,
      # 只能用上一季當先驗。所以調參季 2024-25 要 2023-24 的、驗收季 2025-26 要 2024-25 的。
      #
      # 一季 20 個請求、間隔 1.6 秒,而且**抓過就跳過**(歷史季不會變),
      # 所以只有第一次會真的連外。抓不到不擋部署。
      - name: 抓歷史賽季的進球情境(Understat・一次性)
        run: |
          npm run setpieces -- --season=2023-24
          npm run setpieces -- --season=2024-25
          # 西甲兩季。特徵驗收要「調參一季、驗收另一季」,而兩季都要各自的**前一季**
          # 當先驗(用本季彙總預測本季就是偷看未來),所以 2023-24 與 2024-25 都要。
          npm run laliga:setpieces -- --season=2023-24
          npm run laliga:setpieces -- --season=2024-25
        continue-on-error: true

      # 西甲外電翻成中文。**只翻已經抓下來的快取,不連外抓新聞** ——
      # 翻譯結果依內容雜湊永久快取,同一篇不會翻第二次。
      # 沒有 ANTHROPIC_API_KEY 就安靜跳過,畫面顯示原文(不是錯誤)。
      - name: 翻譯西甲外電
        working-directory: epl
        run: npm run news:translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true

      # SportMonks 西甲欄位與已完賽資料同步；有快取且未超過 7 天就不重抓。
      # 沒有 Secret 時安全略過，不影響其他資料建置。
      - name: 探測西甲 SportMonks 方案能力
        run: npm run sportmonks:capabilities -- --league=es1
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          SPORTMONKS_KEY: ${{ secrets.SPORTMONKS_KEY }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
        continue-on-error: true

      - name: 補齊西甲球員欄位(SportMonks)
        # 兩季名單、現任教練與本季完賽詳情共約 90 次；保留 160 次餘額，
        # 確保同步器不會在抓完名單／教練後因舊上限而跳過賽後統計。
        run: npm run sportmonks:sync -- --league=es1 --max-requests=160 --max-details=20 --max-coach-details=20
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          SPORTMONKS_KEY: ${{ secrets.SPORTMONKS_KEY }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
        continue-on-error: true

      # LaLiga 官方 staff 頁每日核對現任教練；24 小時內使用快取，SportMonks 只補官方缺頁。
      - name: 核對西甲官方教練
        run: npm run laliga:official-coaches
        continue-on-error: true

      # SportMonks 是英超的主要球員／賽後資料來源；FPL 與 API-Football 只作
      # 統計鏡像或備援。同步器會依 token 實際可用賽季動態找 season id。
      # 英格蘭盃賽(足總盃 / 聯賽盃)。season id 當場解析,不寫死 ——
      # 每季都會換一組,寫死的話明年會安靜地抓到去年的資料。
      # 單線、間隔 350ms、硬上限 40 個請求;快取 12 小時內不重抓。
      - name: 抓英格蘭盃賽賽果
        working-directory: epl
        run: npm run encups
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          SPORTMONKS_KEY: ${{ secrets.SPORTMONKS_KEY }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}

      # 歐冠。football-data.org 免費方案限 10 req/分,所以一季一個請求、間隔 7 秒。
      # 2026-27 目前回 404(還沒建立,九月中才開打)—— 那不是「拿不到」,
      # 腳本會照實記成 not-published 並繼續,不讓整個流程變紅。
      # 英格蘭各級聯賽的球隊名單(openfootball 靜態檔,免費、不用額度)。
      # 盃賽頁靠它講出對手是第幾級的球隊。上游發布本季的英甲/英乙之後,
      # 這一步會自動把「退回上一季」的那些改成當季層級。
      - name: 更新英格蘭聯賽層級名單
        working-directory: epl
        run: npm run tiers
        continue-on-error: true

      # 盃賽對手的隊徽。網址是 encups 順手留下來的(零額外 API 請求),
      # 這一步只是把圖抓下來縮圖內嵌。單線、間隔 200ms、每次上限 120 張、
      # 已抓過的略過,所以穩定之後每次執行幾乎不發請求。
      - name: 抓盃賽對手隊徽
        working-directory: epl
        run: npm run cup-crests
        continue-on-error: true

      # 人工整理的外電:交付檔(收件匣)併進檔案庫。
      # 沒有這一步的話,下一次交付會把上一週的整批蓋掉,而且不會有任何地方報錯。
      # 內容沒變就不寫檔,所以每 10 分鐘跑一次不會產生雜訊提交。
      - name: 合併人工整理外電
        working-directory: epl
        run: npm run news:merge

      - name: 抓歐冠賽果
        working-directory: epl
        run: npm run ucl
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        continue-on-error: true

      - name: 同步英超主要資料(SportMonks)
        run: npm run sportmonks:sync -- --league=pl --max-requests=65 --max-details=10
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          SPORTMONKS_KEY: ${{ secrets.SPORTMONKS_KEY }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
          SPORTMONKS_EPL_LEAGUE_ID: 8
        continue-on-error: true

      # 人工交付的頭貼「指定網址」在這一步生效。單線、每次上限 5 人，
      # 而且只挑「這個網址規則還沒試過」的人 —— 已經在官方 CDN 試過並失敗的
      # 不會重來，所以實際請求數通常是個位數。
      # 頭貼要縮圖並轉成 JPEG,本專案零 npm 依賴所以借 Python 的 Pillow。
      # runner 預設沒有裝 —— 少了這一步,補抓頭貼會在抓第一個人時就掛掉,
      # 而且因為 continue-on-error,那個錯誤從 2026-08-28 第一次跑起就一直沒被發現。
      - name: 安裝 Pillow(頭貼縮圖與轉檔用)
        run: python3 -m pip install --quiet --disable-pip-version-check pillow
        continue-on-error: true

      - name: 補抓指定網址的球員頭貼
        run: npm run photos -- --limit=5
        continue-on-error: true

      # 英超官方 CDN 沒有的少量頭貼，SportMonks 名單會先補入；
      # API-Football 僅作最後備援，避免把兩個來源的資料混在一起。
      # 每次最多 10 人、每日最多 10 次，結果寫入 photos.json 快取。
      - name: API 補抓英超缺少球員頭貼
        run: npm run photos:api
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_PHOTO_SEASON: 2024
          API_FOOTBALL_PHOTO_DAILY_LIMIT: 10
        continue-on-error: true

      - name: 抓即時比賽狀態(官方 FPL API)
        run: npm run live
        env:
          # 完賽時 fetch-live 會沿用既有 Secret 補抓完整球員/球隊/事件資料。
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        continue-on-error: true

      # 補抓先前已完賽但尚未進永久快取的場次。已成功的比賽在任何 API 請求前就會略過，
      # 因此每 12 小時執行不會反覆消耗額度。
      - name: 補抓完整賽後資料(API-Football)
        run: npm run postmatch
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        continue-on-error: true

      # 西甲完賽後只抓一次完整資料。每次先讀永久快取，已成功場次在任何網路請求前略過；
      # 一場必須同時有球隊統計、兩隊正式陣容、事件、球員資料與評分，且比分核對一致才發布。
      - name: 補抓西甲完整賽後資料(API-Football)
        run: npm run laliga:postmatch
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        continue-on-error: true

      - name: 抓本季逐輪球員資料
        run: npm run season
        continue-on-error: true

      # 英超官方(pulselive)的正式陣容、陣型與現任教練。
      # 抓過的已完賽場次不會再抓,平常一次執行只打 2~3 個請求;
      # 失敗完全無害 —— build 拿不到官方檔就自動退回角色推導。
      - name: 抓官方陣容與教練(pulselive)
        run: npm run official
        continue-on-error: true

      # 英超官方沒有教練頭貼欄位；西甲官方缺圖也由公開人物縮圖補位。
      # 24 小時快取，成功與失敗都記錄，不在開頁時連線。
      - name: 補齊英超與西甲教練頭貼
        run: npm run coach-photos
        continue-on-error: true

      # 博彩收盤賠率(football-data.co.uk,免金鑰)。歷史季固定、抓過就跳過;
      # 回測會拿它去算「模型 vs 市場」。抓不到就少一條基準線,其餘照常。
      - name: 抓博彩賠率(football-data.co.uk)
        run: npm run odds
        continue-on-error: true

      # 西甲賠率。這個站的西甲隊名拼法本站還沒見過,而沙箱連不到外網沒辦法先看 ——
      # 所以腳本設計成:對不上太多就**拒絕寫入並把上游隊名印出來**。
      # 第一次跑預期會失敗並列出那些字串,照著補進對照表之後下一次就會成功。
      # 猜一張看起來很合理的對照表是最糟的做法:配錯的比賽會靜靜消失在回測母體外。
      - name: 抓西甲博彩賠率
        run: npm run laliga:odds
        continue-on-error: true

      # 西甲回測要在 laliga:build **之前**跑:模型頁上的準度數字是 build 讀
      # data/backtest-laliga.json 帶進 meta 的。順序反過來的話,這次抓回來的新賽果
      # 要等下一次執行才會反映在頁面上 —— 畫面比資料晚一輪,而且沒人看得出來。
      - name: 西甲走查回測(模型準度)
        run: npm run laliga:backtest

      # 人工交付的租借紀錄要先過核對器才會被 build 採用。
      # 核對是離線的(只讀倉庫裡的逐季聯賽成員資格、FPL 逐季分鐘與西甲逐季球員),
      # 不呼叫任何外部 API;退回了哪幾筆會印在 log 裡,要看那一段。
      - name: 核對人工交付的租借紀錄
        run: npm run loans:verify

      # 先建西甲再建英超。順序不能反:stamp-assets 掛在 build 最後,會把資產戳
      # 寫進**兩個聯賽**的 meta.json;反過來跑的話 laliga:build 會把 es1 的 meta 重寫掉。
      - name: 建立西甲資料集
        run: npm run laliga:build

      # 英冠回測同樣要在 en2:build **之前**:模型頁的準度數字是 build 讀
      # data/backtest-championship.json 帶進 meta 的。零 fetch 的本地計算,
      # 所以失敗不容忍 —— 失敗代表真的有 bug。
      # 人工交付的球隊資料(隊色、城市、球場、容量、綽號)要先過核對器才會被 build 採用。
      # 核對是離線的:對照 12 支本站既有球隊的既有欄位、拿倉庫裡的隊徽獨立比隊色、
      # 檢查容量量級與逐欄位出處。有一項對不上就整份不採用,不挑著用。
      - name: 核對人工交付的英冠球隊資料
        run: npm run en2:verify-teams

      # 教練交付同一套:收件匣 → 核對器 → 產物,對照組是 6 支英超球隊的官方每日名單
      - name: 核對人工交付的英冠教練
        run: npm run en2:verify-coaches

      - name: 英冠走查回測(模型準度)
        run: npm run en2:backtest

      # 英冠也要排在英超 build 之前:stamp-assets 掛在 build 最後,
      # 會把資產戳寫進**每一個聯賽**的 meta.json;反過來跑的話戳會被重寫掉,
      # npm test 的「meta 記的戳跟實際檔案一致」就會紅。
      - name: 建立英冠資料集
        run: npm run en2:build

      # 近況/交手特徵的調參與驗收。三個賽季都已完結,數字很穩定 ——
      # 跑它是為了讓模型頁上「測過但沒進模型」那一段的數字永遠是現跑的,而不是寫死的。
      - name: 特徵驗證(調參賽季挑係數、驗收賽季驗收)
        run: npm run tune:form

      # 進球情境特徵。兩個聯賽都跑 —— **沒通過也要跑**,
      # 模型頁上「測過但沒進模型」那一段的數字必須是現跑的,不是寫死的。
      - name: 進球情境特徵驗收(兩個聯賽)
        run: |
          npm run tune:situations
          npm run tune:situations -- --league=es1

      - name: 建立資料集
        run: npm run build
        env:
          # 選用的資料源:沒設 secret 就是空字串,adapter 會自動跳過,build 照樣完成。
          # 設定方式:repo → Settings → Secrets and variables → Actions
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 這兩步刻意排在 npm test **之前**:測試是部署的閘門,擋下來的話後面都不會跑,
      # 而傷停快照記的是「今天誰不能上」—— 漏掉一天明天補不回來(60 天累積會斷)。
      # 資料先落地,測試再決定要不要部署。
      # 存一份「今天誰不能上」。上游(FPL)只給現在、不給歷史,
      # 自己每天存才能累積出逐輪快照 —— 那是將來把傷停拿去走查回測的唯一辦法。
      - name: 傷停快照(累積成可回測的歷史)
        run: npm run snapshot

      # 把抓到的即時資料寫回 repo,這樣在別的環境(拿不到官方 API 的地方)
      # 只要 git pull 就能用最新比分重新建置。
      # 只在預設分支回寫,否則多個分支各自累積資料提交會互相分岔。
      # 排程本來就只在預設分支跑,所以資料一律以預設分支為準。
      - name: 回寫即時資料
        if: github.ref_name == github.event.repository.default_branch
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f epl/data/raw/live.json epl/data/raw/season-gws.json \
                     epl/data/raw/openfootball/ epl/data/raw/pulselive/ \
                     epl/data/raw/openfootball-la-liga/ \
                     epl/data/raw/news-la-liga-zh.json \
                     epl/data/raw/news-championship.json \
                     epl/data/championship-teams-verified.json \
                     epl/data/live-history.json \
                     epl/data/championship-coaches-verified.json \
                     epl/data/raw/understat/ \
                     epl/data/raw/understat-la-liga/ \
                     epl/data/raw/sportmonks-la-liga/ \
                     epl/data/raw/sportmonks-epl/ \
                     epl/data/raw/sportmonks-cups/ \
                     epl/data/raw/football-data/ \
                     epl/data/raw/probes/ \
                     epl/data/raw/api-football/ \
                     epl/data/raw/api-football-la-liga/ \
                     epl/data/raw/football-data-couk/ \
                     epl/data/raw/football-data-couk-la-liga/ \
                     epl/data/backtest.json epl/data/backtest-matches.json \
                     epl/data/backtest-laliga.json epl/data/backtest-laliga-matches.json \
                     epl/data/raw/openfootball-championship/ \
                     epl/data/raw/football-data-couk-championship/ \
                     epl/data/backtest-championship.json epl/data/backtest-championship-matches.json \
                     epl/data/form-tuning.json epl/data/availability-history.json \
                     epl/data/situation-tuning.json epl/data/situation-tuning-es1.json \
                     epl/data/congestion-tuning.json 2>/dev/null || true
          git add -f epl/data/manual/photos.json epl/data/manual/crests-cups.json epl/data/manual/team-tiers.json 2>/dev/null || true
          git add -f epl/data/manual/news-curated-archive.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "資料沒有變化,不提交"
          else
            # [skip ci] 避免這個提交又觸發自己
            git commit -m "chore(epl): 更新即時資料 $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "已回寫即時資料"
          fi

      # Pages 還沒啟用時,deploy 會失敗;先問一下,沒開就跳過,不讓整個流程變紅

      # **必須在 build 之後。** 資產戳是 build 最後一步(stamp-assets)寫的,
      # 而 npm test 有一節在驗「meta 記的戳跟實際檔案一致」。
      # 原本這一步夾在 laliga:build 與 build 中間 —— 那個時間點 es1 的 meta 剛被
      # laliga:build 重寫、戳還沒補回來,所以那兩條**每次 CI 都假紅**,
      # 只是 continue-on-error 讓沒有人去看。2026-08-28 修正。
      - name: 走查回測與自我檢查(要在 build 之後,資產戳才是最終狀態)
        run: npm test

      - name: 打包單檔版
        run: npm run bundle

      - name: 檢查 GitHub Pages 是否已啟用
        id: pages_check
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✔ Pages 已啟用,將進行部署"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "⚠ Pages 尚未啟用(HTTP $code),略過部署。"
            echo "  到 Settings → Pages → Source 選 \"GitHub Actions\" 即可,之後每次執行都會自動部署。"
          fi

      - name: 把單檔版一起放進要部署的目錄
        if: steps.pages_check.outputs.enabled == 'true'
        run: cp dist/warroom.html web/warroom.html

      - name: 設定 GitHub Pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: 上傳網站
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: epl/web

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
