# 資料源探測 —— 只手動觸發,不排程。
#
# 用途:沙箱與開發機不一定連得到外部 API,但 GitHub 的 runner 可以。
# 設好 secret 之後跑這個,就能知道哪些資料源真的能接、回傳長什麼樣。
#
# 設定金鑰:repo → Settings → Secrets and variables → Actions → New repository secret
#   API_FOOTBALL_KEY    api-sports.io 的金鑰
#   FOOTBALL_DATA_TOKEN football-data.org 的 token
# 兩個都是選用的,沒設就會顯示「略過」,不會讓流程失敗。
# SportMonks 2026-09-03 退訂,那幾步已拿掉(腳本留著當紀錄:probe-sportmonks*.mjs)。
#
# 兩個 job:`latest` 是最新要判讀的那幾支,`all` 是歷來全部。
# 勾 quick 就只跑 latest —— 全部跑一次要十幾分鐘,而且前面任何一步紅了後面的就看不到。
#
# **新加的探測排在 latest 的最後一步。** 讀結果的方法是抓 job log 的**尾端**
# (整份 log 幾百行,而下載連結在沙箱被 egress 擋掉),排在前面的話它的輸出會被
# 後面那幾步擠出視窗 —— 2026-09-13 實際踩到:新探測成功跑完,但看不到它印了什麼。

name: 資料源探測

on:
  workflow_dispatch:
    inputs:
      quick:
        description: '只跑最新的探測(盃賽逐場詳情有沒有賽後報告),略過其他'
        type: boolean
        default: false

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # SportMonks 退訂後足總盃/聯賽盃沒有來源。站上已在用 FotMob 的聯賽端點(47/87/48),
      # 抓 logo 時實證 132/133 的名字是 FA Cup / EFL Cup —— 這一步看盃賽在同一個端點回什麼形狀
      # (輪次名、PK/延長、隊 id、隊徽網址),並拿倉庫裡 SportMonks 的舊快取逐場核對。
      # 唯讀、最多 9 個請求、不寫任何快取。
      - name: 探測 FotMob 英格蘭盃賽(足總盃 132 / 聯賽盃 133)
        working-directory: epl
        run: npm run probe:fotmob-cups -- --only=details

      # 2026-09-11,使用者問「歐冠沒有賽完紀錄可以看?」—— 現在踢完只剩比分,
      # 因為 ucl.json 來自 football-data.org 的賽事端點(賽果 + 積分榜)。
      # 但三個聯賽的賽後報告就是 FotMob 逐場詳情給的,盃賽也已經走同一條路,
      # 所以先問「歐冠在同一組端點回什麼」,不憑印象寫 adapter。
      # 唯讀、最多 8 個請求(目錄 1 + 賽程 1 + 單場 3),不寫任何快取。
      # 聯賽 id **走 allLeagues 目錄用名字找,不是猜的**。
      - name: 探測歐冠逐場詳情(FotMob)
        working-directory: epl
        run: npm run probe:ucl-details

      # SportMonks 的 **API** 2026-09-03 退訂了,而西甲球員檔的頭貼是
      # `cdn.sportmonks.com` 的**靜態圖片網址**(英超是內嵌 base64,不受影響)。
      # 「API 停了」跟「圖片 CDN 停了」是兩件事 —— 沙箱連不到外網,所以在這裡問。
      # 只發 12 個 HEAD,而且這些網址本來就印在已部署的西甲球員頁上。
      - name: 探測球員頭貼的 CDN 還供不供圖(退訂之後)
        working-directory: epl
        run: npm run probe:photo-cdn

      # 階段 C 的跨聯賽 Elo 現在涵蓋 25/36 隊,本季 76 場沒有預測 —— 因為那 11 支球隊的
      # 聯賽 openfootball 沒有(tr/be/at/no/ua/sk/cz/gr/az 逐一試過全部 404)。
      # 但「openfootball 沒有」不等於「拿不到」,那是鐵則三那條坑。這一步問 FotMob
      # 有沒有那些聯賽,而且**隊名對不對得上** —— 第二個才是難的:football-data 給的是
      # `FK Shakhtar Donetsk` 這種正式全名,對不上的話有聯賽也接不起來。
      # 唯讀、最多 17 個請求、不寫任何快取。近似命中會單獨列出來讓人逐筆看。
      - name: 探測歐冠缺的那些聯賽 FotMob 有沒有(以及隊名對不對得上)
        working-directory: epl
        run: npm run probe:ucl-coverage

      # 2026-09-13:歐冠單場頁做完之後,盃賽是唯一還沒有單場頁的賽事 —— 原因不是前端,
      # 是沒有逐場詳情。前兩輪只看了 header 的 PK 欄位,**沒看 content 裡有沒有
      # stats / shotmap / lineup / playerStats**(「沒看過」不等於「沒有」)。
      # 取樣重點是**分級**:足總盃第一輪是第三、四級球隊互打,FotMob 對低級別未必有
      # 射門圖與逐人評分。只抓到一場就宣布能做是錯的 —— 結論可能是
      # 「盃賽的哪一些場次做得到」,而那必須在畫面上講(鐵則三、四)。
      # 場次取自倉庫裡的盃賽快取(id 是抓取器在用的那些),唯讀、4 個請求。
      - name: 探測盃賽逐場詳情有沒有賽後報告那幾塊
        working-directory: epl
        run: npm run probe:fotmob-cups -- --only=report

      # 2026-09-15:德甲上線了球隊與比賽層,球員層是唯一還缺的東西。
      # 德甲是 Understat 涵蓋的五大聯賽之一,所以這是「還沒抓」不是「拿不到」——
      # 但**聯賽代號的字串要實測**:西甲那條是 `La_liga`(底線、小寫 l),
      # 照直覺推德甲會得到什麼寫法不一定對,而這個端點猜錯**不回 HTTP 錯誤**,
      # 它回 200 加一個 error 物件,或是一個空陣列(英冠那次四種寫法全回空陣列)。
      # 候選逐一試 + 西甲當對照組,才分得出「德甲沒有」與「整個端點不通」。
      # 唯讀、最多 6 個請求、每個隔 1.5 秒,一個位元組都不寫進倉庫。
      - name: 探測 Understat 有沒有德甲球員資料(以及聯賽代號是哪個字串)
        working-directory: epl
        run: npm run probe:understat-de1

      # 2026-09-15:德甲的球員層接上了,缺的是比賽層(賽後報告、逐場統計、單場頁)。
      # 逐場抓取器已經參數化給六個賽事用,加德甲是表裡多一列 —— **但 id 要先證明**。
      # 這裡特別危險:倉庫裡已經有一個叫 Bundesliga 的聯賽(at1,奧地利甲,id 38),
      # 照名字挑會挑到它,而它照樣回得出 18 隊與逐場資料,畫面不報錯、整個聯賽是錯的。
      # 所以這支從 allLeagues 找 ccode=GER,再**逐隊比對本站名冊**才算證明
      # (挑到奧地利的話一支都不會對上)。順便取樣兩場看逐場詳情有沒有那五塊。
      # 唯讀、最多 8 個請求、不寫快取。
      - name: 探測 FotMob 的德甲聯賽 id 與逐場詳情
        working-directory: epl
        run: npm run probe:fotmob-de1

      # 義甲與法甲能不能照德甲那條路做三層。openfootball 已經在沙箱驗過(義甲四季各 380 場、
      # 法甲各 306 場,全部有比分),football-data.co.uk 的 I1/F1 倉庫裡也有舊季可以看欄位 ——
      # 剩下只有 Understat 的聯賽代號與 FotMob 的聯賽 id 沙箱問不到,這支就是問那兩個。
      # 同名陷阱跟德甲同一種而且更多:巴西也有 Serie A、義大利有 Serie B 與女足 Serie A、
      # 法國有 Ligue 2 與 D1 Féminine。所以 FotMob 那一段一樣要**逐隊比對 openfootball**
      # 才算證明,Understat 那一段候選字串逐一試 + 西甲當對照組。
      # 唯讀、最多 22 個請求、不寫快取。**這是 latest job 的最後一步**(讀結果靠 log 尾端)。
      - name: 探測義甲與法甲做不做得成完整聯賽
        working-directory: epl
        run: npm run probe:new-leagues

  all:
    if: ${{ github.event.inputs.quick != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: 探測各候選資料源
        working-directory: epl
        run: npm run probe:apis
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      # 探勘缺口 C/D/E/H:API-Football 的聯賽 ID 與逐季 coverage flags + 抽樣實打。
      # ID 自己用 search 查(交付引用的是另一家同名服務的 ID,不能照抄);
      # 約 15 個請求,遠低於免費層 100/day。
      - name: 探測 API-Football 涵蓋範圍(傷停/英冠球員/教練聯賽)
        working-directory: epl
        run: npm run probe:apifootball
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      - name: 探勘回傳結構
        working-directory: epl
        run: npm run explore:apis
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      # 進球細節:官方單場詳情有沒有進球事件、FPL 鏡像有沒有逐輪歷史檔
      - name: 探測進球細節資料源
        working-directory: epl
        run: npm run probe:goals

      # 進球方式(運動戰/角球/任意球):找不需要大量請求的來源。這一步只打 2 個請求。
      - name: 探測進球方式資料源
        working-directory: epl
        run: npm run probe:events

      # 英格蘭盃賽:docs 上「英國盃賽不在免費方案裡」那句是對 football-data.org 說的,
      # 但沒有人去看 openfootball 自己的 England 倉庫(那裡有 facup.txt / eflcup.txt)。
      # 這一步把兩邊都實際打一次,順便讓 football-data.org 的賽事清單有紀錄。
      # (SportMonks 那一段沒有 token 會自己略過。)
      - name: 探測英格蘭盃賽資料源
        working-directory: epl
        run: npm run probe:encups
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      # 歐冠:football-data.org 的 token 授權清單裡有 CL,但免費方案常常只開放
      # 目前那一季 —— 要分得開 403(方案不給)、404(路徑錯)、200+0 場(還沒開打)。
      # 免費方案限 10 req/分,所以這一步硬上限 8 個請求、每個間隔 7 秒。
      - name: 探測歐冠資料
        working-directory: epl
        run: npm run probe:ucl
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      # 西甲球員資料:動手寫抓取管線之前先確定拿得到什麼。硬上限 5 個請求。
      - name: 探測西甲球員端點
        working-directory: epl
        run: npm run probe:laliga-players
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      # API-Football 的 Free 方案只開放 2022–2024,本季與上季都拿不到 ——
      # 回頭找已經在用、而且不需要大量請求的來源。單線,最多 5 個請求。
      - name: 探測西甲球員整季數據的替代來源
        working-directory: epl
        run: npm run probe:laliga-playerdata

      # 西甲逐場先發/陣型/評分:只找一場已完賽比賽,最多 3 個請求,不做整季抓取
      - name: 探測西甲逐場先發與陣型來源
        working-directory: epl
        run: npm run probe:laliga-lineups

      # log 只看得到尾端,所以這裡只印真正要判讀的那一段。
      # 上一輪用 `head -200` 把整份 JSON 倒出來,結果最重要的那一節正好被截掉 —— 印太多跟沒印一樣。
      - name: 印出探測結果
        working-directory: epl
        run: |
          echo '── football-data.org 授權的賽事 ──'
          node -e "const j=require('./data/raw/probes/en-cups.json');const f=j.footballData??{};console.log('HTTP',f.status,'・',f.count,'個・英格蘭盃賽:',JSON.stringify(f.englishCups??[]))" || echo '(無)'
          echo '── 歐冠 ──'
          # 不要整份倒出來:competition.seasons 有四十幾季,會把結論擠出 log 尾端
          node -e "const j=require('./data/raw/probes/ucl.json');
            console.log('competition HTTP', j.competition.status, '|', j.competition.name,
              '| 本季', JSON.stringify(j.competition.currentSeason),
              '| 回報賽季數', j.competition.seasons.length);
            for (const [k,v] of Object.entries(j.seasons)) console.log(JSON.stringify({season:k, ...v}));" || echo '(無)'

      # SportMonks 方案 2026-09-03 取消後,探 FotMob 能不能接手西甲賽後資料。
      # 唯讀、最多 3 個請求、不寫任何快取。
      - name: 探測西甲賽後資料的替代來源(FotMob)
        working-directory: epl
        run: npm run probe:laliga-postmatch
        continue-on-error: true
